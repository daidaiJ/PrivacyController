# Privacy Vault CLI 配置文件
# 将敏感数据替换为占位符，防止在 AI 编程助手中泄露隐私
# ⚠️ 此文件包含个人隐私数据，请勿提交到仓库（已在 .gitignore 中排除）

[defaults]
# 全局默认的文件大小限制（超过此大小的文件跳过替换）
max_file_size = "10MB"

# 全局默认文件类型白名单（只替换匹配这些 glob 模式的文件）
# 注释掉 = 对所有文件生效
# path_include = ["*.yaml", "*.json", "*.env", "*.toml", "*.md", "*.go", "*.py", "*.js", "*.ts"]

# 全局默认文件类型黑名单（跳过这些文件）
path_exclude = ["*.lock", "*.exe", "*.dll", "*.png", "*.jpg", "*.ico", "*.svg", "*.woff2", "*.ttf"]

# =========================================
# 替换规则
# 每条规则独立配置路径过滤和大小限制
# =========================================

# --- token 模式（gse 中文分词，适合中文姓名） ---
[[rules]]
match = "张三"
mode = "token"
placeholder = "<USER-NAME-MASKED>"

# --- exact 模式（全词匹配，适合英文标识符、手机号、邮箱） ---
[[rules]]
match = "13800138000"
mode = "exact"
placeholder = "<PHONE-MASKED>"

[[rules]]
match = "zhangsan@example.com"
mode = "exact"
placeholder = "<EMAIL-MASKED>"

# --- substring 模式（子串匹配，适合地址、长文本片段） ---
[[rules]]
match = "北京市朝阳区建国路88号"
mode = "substring"
placeholder = "<ADDRESS-MASKED>"

# --- 带路径过滤的规则（只在特定文件类型中生效） ---
[[rules]]
match = "sk-xxxxxxxxxxxxxxxxxxxx"
mode = "exact"
placeholder = "<API-KEY-MASKED>"
path_include = ["*.env", "*.yaml", "*.json"]
max_file_size = "1MB"

# --- 带大小限制的规则 ---
[[rules]]
match = "my-secret-token-12345"
mode = "exact"
placeholder = "<SECRET-MASKED>"
max_file_size = "5MB"
